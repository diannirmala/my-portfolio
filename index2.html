<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Web</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ===== COLORS (change these to your favorite colors!) ===== */
      :root {
        --bg: #bfe6ff; /* sky blue */
        --paper: #ffffff; /* card */
        --text: #1d3557; /* dark blue */
        --sun: #ffd93d; /* yellow */
        --line: #1d3557; /* border color */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #14213d;
          --paper: #1f2f52;
          --text: #f1f5ff;
          --sun: #e9b800;
          --line: #f1f5ff;
        }
      }

      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font-family: "Fredoka", "Comic Sans MS", sans-serif;
      }

      /* The big box */
      .page {
        max-width: 700px;
        margin: 0 auto;
        background: var(--paper);
        border: 4px solid var(--line);
        border-radius: 20px;
        padding: 30px;
      }

      /* Top part: hello text + picture side by side */
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 40px;
        margin: 0 0 10px;
      }
      .age {
        font-size: 24px;
        margin: 0;
      }

      /* Picture frame */
      .photo {
        width: 180px;
        height: 180px;
        border: 4px solid var(--line);
        border-radius: 16px;
        background: var(--sun);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 80px;
        overflow: hidden;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Short intro box */
      .intro {
        margin-top: 30px;
        border: 3px solid var(--line);
        border-radius: 16px;
        padding: 20px;
        font-size: 20px;
        line-height: 1.6;
      }
      .intro h2 {
        margin: 0 0 8px;
      }

      /* Footer */
      footer {
        text-align: center;
        margin-top: 30px;
        font-size: 18px;
      }
      .heart {
        color: #e63946;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <!-- TOP: Hello + picture -->
      <div class="top">
        <div>
          <h1>Hello, I'm Dian!</h1>
          <!-- change to your name -->
          <p class="age">I'm 22 years old.</p>
          <!-- change to your age -->
        </div>

        <div class="photo">
          <img src="WIN_20260603_19_11_47_Pro.jpg" alt="Photo of Ms. Dian" />
        </div>
      </div>

      <!-- SHORT INTRO -->
      <div class="intro">
        <h2>About me</h2>
        <p>
          I'm a teacher who loves helping kids learn new things. Today, I want
          to show you how to make your own web page! When I'm not teaching, I
          like reading and drawing. 📚
        </p>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>Made with <span class="heart">♥</span> by Dian</footer>
  </body>
</html>
